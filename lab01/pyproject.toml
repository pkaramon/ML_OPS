[project]
name = "ml-ops"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piotr Karamon", email = "piotrkaramon3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-dotenv>=0.5.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
env_files = ["./config/.env.test"]

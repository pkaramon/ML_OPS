[project]
name = "hw01"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Piotr Karamon", email = "piotrkaramon3@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "clean-text>=0.7.1",
    "fastapi>=0.143.0",
    "joblib>=1.6.0",
    "scikit-learn==1.7.2",
    "sentence-transformers>=6.1.0",
    "torch>=2.14.1",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
strict = true
exclude = ["^\\.venv/"]

[[tool.mypy.overrides]]
module = ["sklearn.*", "joblib.*", "cleantext.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

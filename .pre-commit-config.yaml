repos:
   - repo: https://github.com/astral-sh/ruff-pre-commit
     rev: v0.15.6
     hooks:
        - id: ruff-check
          args: [--fix]
        - id: ruff-format
   - repo: https://github.com/rubik/xenon
     rev: v0.9.0
     hooks:
     - id: xenon
       args: ['--max-absolute=B', '--max-modules=B', '--max-average=A']

   - repo: local
     hooks:
     - id: mypy-hw01
       name: mypy (hw01)
       entry: uv run --directory hw01 mypy .
       language: system
       files: ^hw01/.*\.py$
       pass_filenames: false
